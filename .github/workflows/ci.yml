name: Test
on:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  docker-build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t arara-zap:ci .
      - name: Exportar imagem de development
        if: github.ref == 'refs/heads/development'
        run: |
          mkdir -p dist
          docker save arara-zap:ci | gzip > dist/arara-zap-development-docker.tar.gz
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/development'
        with:
          name: arara-zap-development-docker
          path: dist/
          if-no-files-found: error
          retention-days: 14

  development-package:
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Empacotar código de development
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=arara-zap/ --output=dist/arara-zap-development.tar.gz HEAD
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: arara-zap-development
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: arara-zap-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Publish version from package.json
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          current_version=$(node -p "require('./package.json').version")
          tag="v${current_version}"
          target_sha="$GITHUB_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag já existe. Para uma nova release, incremente a versão por PR."
            exit 0
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target_sha" --title "$tag" --generate-notes --latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  docker:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

services:
  zap:
    image: ghcr.io/arara-ide/arara-zap:0.1.0
    build: .
    environment:
      ZAP_PASSWORD: ${ZAP_PASSWORD:?Defina ZAP_PASSWORD}
      ZAP_ALLOWED_NUMBER: ${ZAP_ALLOWED_NUMBER:-}
    ports: ["127.0.0.1:7310:7310"]
    volumes: ["zap-data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
volumes:
  zap-data:
